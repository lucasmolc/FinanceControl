# Configuração do servidor na rede local (lida por iniciar.cmd). Formato: CHAVE=valor, sem aspas.

# Porta HTTP em que o servidor escuta.
PORTA=5074

# Caminho absoluto do banco. Vazio = o mesmo banco usado por "npm run dev" (src\FinanceControl.Api\Data\finance.db).
BANCO=

# Nomes extras aceitos no endereço, separados por ";" (ex.: um nome configurado no roteiro, finance.casa).
# localhost, o nome do computador e os IPs atuais da máquina já são aceitos automaticamente.
HOSTS_EXTRAS=
