# Configuração do servidor na rede local (lida por iniciar.cmd). Formato: CHAVE=valor, sem aspas.

# Porta HTTP em que o servidor escuta.
PORTA=5074

# Pasta de dados (contas em accounts.db e um banco por usuário em users\<id>\finance.db).
# Vazio = a mesma pasta usada por "npm run dev" (src\FinanceControl.Api\Data). Use um caminho absoluto, ex.: D:\FinanceControl\dados
DADOS=

# Nomes extras aceitos no endereço, separados por ";" (ex.: um nome configurado no roteador, financas.casa).
# localhost, o nome do computador e os IPs atuais da máquina já são aceitos automaticamente.
HOSTS_EXTRAS=
